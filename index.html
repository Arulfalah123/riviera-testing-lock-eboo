<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buka Ebook Prompt</title>
<style>
  :root {
    --bg1: #dbe8f5;
    --bg2: #f4f8fc;
    --card: #ffffff;
    --text: #0f1d2e;
    --muted: #5b6b7d;
    --line: #d4dde8;
    --field: #ffffff;
    --blue1: #2a7bd0;
    --blue2: #15579a;
    --ok: #1f9d6b;
    --err: #c0392b;
    --stage: #6f7782;
    --ink: #0b0b0c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      linear-gradient(115deg, transparent 38%, rgba(255,255,255,.75) 42%, transparent 46%),
      linear-gradient(115deg, transparent 60%, rgba(255,255,255,.6) 63%, transparent 66%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  /* Latar belakang samar, meniru daftar yang terkunci */
  .backdrop {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    padding: 24px 16px; filter: blur(3px); opacity: .55;
  }
  .backdrop .row {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin: 0 auto 12px; max-width: 640px;
  }
  .backdrop .bar { height: 10px; border-radius: 5px; background: var(--line); margin: 8px 0; }
  .backdrop .bar.short { width: 45%; }

  .wrap {
    position: relative; z-index: 1;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 16px; gap: 16px;
  }

  .card {
    width: 100%; max-width: 420px;
    background: var(--card); border-radius: 20px;
    box-shadow: 0 20px 50px rgba(15, 45, 85, .18);
    overflow: hidden;
  }

  .brand {
    display: flex; justify-content: center; align-items: center;
    padding: 18px 24px;
    background: #0f1d2e;
  }
  .brand img { display: block; height: 36px; width: auto; max-width: 100%; }

  .body { padding: 22px 24px 0; }
  .inner { padding-bottom: 24px; }

  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; font-weight: 800; }
  .lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.55; }

  /* ===== Panggung carousel ebook ===== */
  .stage {
    background: radial-gradient(120% 90% at 50% 0%, #8a929d 0%, var(--stage) 60%, #5b636e 100%);
    padding: 22px 0 16px;
  }
  .picker {
    display: flex; align-items: center; gap: 14px;
    overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 6px 0 10px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .picker::-webkit-scrollbar { display: none; }
  .picker::before, .picker::after { content: ""; flex: 0 0 19%; }

  button.item {
    flex: 0 0 62%; scroll-snap-align: center;
    position: relative;
    display: flex; flex-direction: column;
    height: 262px; margin: 0; padding: 0;
    border: 0; border-radius: 18px; overflow: hidden;
    background: var(--c2); color: #fff;
    font: inherit; text-align: left; cursor: pointer;
    box-shadow: 0 10px 22px rgba(0, 0, 0, .25);
    transform: scale(.9); opacity: .6;
    transition: transform .25s ease, opacity .25s ease;
  }
  button.item.active { transform: scale(1); opacity: 1; }

  .cover {
    flex: 1; position: relative; padding: 16px 16px 14px;
    background: linear-gradient(165deg, var(--c1), var(--c2));
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .cover::before {
    content: ""; position: absolute; width: 180px; height: 180px; right: -70px; top: -60px;
    border-radius: 50%; background: rgba(255,255,255,.12);
  }
  .cover::after {
    content: ""; position: absolute; width: 120px; height: 120px; left: -50px; bottom: -40px;
    border-radius: 50%; background: rgba(0,0,0,.12);
  }
  .cover.cover-img { padding: 14px; background: #ffffff; justify-content: center; align-items: center; }
  .cover.cover-img::before, .cover.cover-img::after { display: none; }
  .cover.cover-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tag {
    position: relative; z-index: 1; align-self: flex-start;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.2);
  }
  .title {
    position: relative; z-index: 1;
    font-size: 24px; font-weight: 800; line-height: 1.15;
    text-shadow: 0 2px 10px rgba(0,0,0,.18);
  }

  .foot {
    background: var(--ink); padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .foot .sub { font-size: 12px; color: #c9ced6; line-height: 1.35; max-width: 70%; }
  .chip {
    flex: 0 0 auto; font-size: 12px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px;
    background: #fff; color: var(--ink);
  }
  button.item:not(.active) .chip { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
  button.item.active .chip { background: var(--ok); color: #fff; }

  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.45); transition: all .2s; }
  .dot.on { width: 18px; background: #fff; }

  /* ===== Form ===== */
  .form-wrap { padding: 20px 24px 0; }
  form { display: grid; gap: 12px; }
  input {
    width: 100%; height: 50px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--field); color: var(--text);
    font: inherit; font-size: 15px; outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--blue1); box-shadow: 0 0 0 3px rgba(42, 123, 208, .18); }
  input.invalid { border-color: var(--err); }

  button.submit, .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 52px; margin-top: 6px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg, var(--blue1), var(--blue2));
    color: #fff; font: inherit; font-size: 16px; font-weight: 700;
    text-decoration: none; box-shadow: 0 8px 18px rgba(21, 87, 154, .3);
  }
  button.submit:disabled { opacity: .6; cursor: default; }

  .pick-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: 14px; background: #f5f8fc;
  }
  .thumb {
    flex: 0 0 auto; width: 44px; height: 58px; border-radius: 6px; overflow: hidden;
    background: linear-gradient(160deg, var(--c1, #2a7bd0), var(--c2, #15579a));
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick-row small { display: block; font-size: 12px; color: var(--muted); }
  .pick-row strong { display: block; font-size: 14px; line-height: 1.35; margin-top: 2px; }

  .note { margin: 14px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .msg { min-height: 18px; margin: 0; font-size: 13.5px; color: var(--err); }

  .unlocked { display: none; text-align: center; }
  .unlocked .tick {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; background: var(--ok); color: #fff; font-size: 28px;
  }
  .unlocked p { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 18px; }

  body.is-open .form-part { display: none; }
  body.is-open .unlocked { display: block; }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <div class="row"><div class="bar"></div><div class="bar short"></div></div>
  <div class="row"><div class="bar"></div><div class="bar short"></div></div>
  <div class="row"><div class="bar"></div><div class="bar short"></div></div>
</div>

<main class="wrap">
  <section class="card">
    <div class="brand">
      <img src="logo-riviera.png" alt="Riviera Publishing" height="36">
    </div>

    <div class="inner">

      <div class="form-part">
        <div class="body">
          <h1>Buka kunci ebook prompt</h1>
          <p class="lead">Pilih ebook, isi data singkat, lalu link akan terbuka. Gratis.</p>
        </div>

        <div class="stage">
          <div class="picker" id="picker" aria-label="Pilih ebook"></div>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>

        <div class="form-wrap">
          <div class="pick-row">
            <div class="thumb" id="thumb"></div>
            <div>
              <small>Ebook yang dipilih</small>
              <strong id="pickTitle"></strong>
            </div>
          </div>
          <form id="unlockForm" novalidate>
            <input id="name" name="name" type="text" placeholder="Nama lengkap" autocomplete="name" required>
            <input id="wa" name="wa" type="tel" placeholder="Nomor WhatsApp aktif" autocomplete="tel" inputmode="tel" required>
            <input id="inst" name="inst" type="text" placeholder="Instansi atau kampus" autocomplete="organization" required>
            <p class="msg" id="msg" role="alert"></p>
            <button type="submit" class="submit" id="submitBtn">Buka ebook</button>
          </form>

          <p class="note">
            Gratis. Data Anda hanya dipakai Riviera Publishing untuk mengirim hasil dan menindaklanjutinya lewat WhatsApp.
            Dengan menekan tombol, Anda menyetujuinya.
          </p>
        </div>
      </div>

      <div class="unlocked body" id="unlocked">
        <div class="tick">&#10003;</div>
        <h1>Ebook sudah terbuka</h1>
        <p id="unlockedTitle"></p>
        <a class="btn" id="ebookLink" href="#" target="_blank" rel="noopener">Klaim ebook</a>
      </div>

    </div>
  </section>
</main>

<script>
  /* ===== KONFIGURASI ===== */
  // Daftar ebook yang bisa dipilih di carousel. Tambah/ubah item di sini.
  const EBOOKS = [
    {
      title: "Prompt Artikel",
      subtitle: "Prompt Bab I–V untuk menyusun artikel jurnal",
      tag: "Prompt",
      link: "https://drive.google.com/file/d/1m43D_3zPtBYRAgl4Zm2bQovebnwCdIAk/view?usp=sharing",
      colors: ["#2a7bd0", "#15579a"],
    },
    {
      title: "Skripsi & Tesis ke Artikel",
      subtitle: "Ubah skripsi atau tesis menjadi naskah jurnal",
      tag: "Prompt",
      cover: "cover-tesis.png",
      link: "https://drive.google.com/file/d/1ev5nOLsVlx0io2tQQyX4Eydt4TtC2bOj/view?usp=sharing",
      colors: ["#1f9d6b", "#0f6b4a"],
    },
    {
      title: "From Zero to Publish",
      subtitle: "Panduan dari nol sampai naskah terbit",
      tag: "Panduan",
      link: "https://drive.google.com/file/d/1syij8LL2aip4wmb7XfowlHVOnQQ0ZNd9/view?usp=sharing",
      colors: ["#7a4fd6", "#4a2a9c"],
    },
  ];

  // URL Web App Google Apps Script untuk menyimpan data peserta. Kosongkan jika belum dipasang.
  const FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycbxfaQsmp8iCoU6ET9W4C2ts8O7xwnQGNlJSrpg-OhVLcNku7zRM7X14_I4ZX2nNp1Uh/exec";
  /* ======================= */

  const $ = (id) => document.getElementById(id);
  const form = $("unlockForm");
  const msg = $("msg");
  const btn = $("submitBtn");
  const nameEl = $("name");
  const waEl = $("wa");
  const instEl = $("inst");
  const picker = $("picker");
  const dotsEl = $("dots");
  const thumbEl = $("thumb");
  const pickTitleEl = $("pickTitle");

  let selected = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderPicker() {
    picker.innerHTML = EBOOKS.map((b, i) => `
      <button type="button" class="item" data-i="${i}" aria-label="${esc(b.title)}"
        style="--c1:${b.colors[0]};--c2:${b.colors[1]}">
        ${b.cover
          ? `<div class="cover cover-img"><img src="${esc(b.cover)}" alt="${esc(b.title)}" loading="lazy"></div>`
          : `<div class="cover">
          <span class="tag">${esc(b.tag)}</span>
          <span class="title">${esc(b.title)}</span>
        </div>`}
        <div class="foot">
          <span class="sub">${esc(b.subtitle)}</span>
          <span class="chip">Pilih</span>
        </div>
      </button>`).join("");
    dotsEl.innerHTML = EBOOKS.map(() => '<span class="dot"></span>').join("");
  }

  function select(i, scroll) {
    selected = i;
    const items = picker.querySelectorAll(".item");
    items.forEach((el, idx) => {
      const on = idx === i;
      el.classList.toggle("active", on);
      el.querySelector(".chip").textContent = on ? "Dipilih ✓" : "Pilih";
    });
    dotsEl.querySelectorAll(".dot").forEach((el, idx) => el.classList.toggle("on", idx === i));
    const b = EBOOKS[i];
    pickTitleEl.textContent = b.title;
    thumbEl.innerHTML = b.cover ? `<img src="${esc(b.cover)}" alt="">` : "";
    thumbEl.style.setProperty("--c1", b.colors[0]);
    thumbEl.style.setProperty("--c2", b.colors[1]);
    if (scroll && items[i]) {
      items[i].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }
  }

  // Saat carousel digeser, pilih item yang paling dekat ke tengah
  let scrollTimer = null;
  picker.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const center = picker.getBoundingClientRect().left + picker.clientWidth / 2;
      let best = selected, bestDist = Infinity;
      picker.querySelectorAll(".item").forEach((el, idx) => {
        const r = el.getBoundingClientRect();
        const dist = Math.abs(r.left + r.width / 2 - center);
        if (dist < bestDist) { bestDist = dist; best = idx; }
      });
      if (best !== selected) select(best, false);
    }, 80);
  }, { passive: true });

  picker.addEventListener("click", (e) => {
    const item = e.target.closest(".item");
    if (!item) return;
    select(Number(item.dataset.i), true);
  });

  renderPicker();
  select(0, false);

  function normalizeWA(raw) {
    let d = (raw || "").replace(/\D/g, "");
    if (d.startsWith("0")) d = "62" + d.slice(1);
    return d;
  }

  function setInvalid(el, bad) {
    el.classList.toggle("invalid", bad);
  }

  function validate() {
    const name = nameEl.value.trim();
    const wa = normalizeWA(waEl.value);
    const inst = instEl.value.trim();
    setInvalid(nameEl, name.length < 2);
    setInvalid(waEl, wa.length < 9 || wa.length > 15);
    setInvalid(instEl, inst.length < 2);
    if (name.length < 2) return "Nama lengkap wajib diisi.";
    if (wa.length < 9 || wa.length > 15) return "Nomor WhatsApp belum valid.";
    if (inst.length < 2) return "Instansi atau kampus wajib diisi.";
    return null;
  }

  function unlock() {
    const book = EBOOKS[selected];
    $("ebookLink").href = book.link;
    $("unlockedTitle").textContent = book.title;
    document.body.classList.add("is-open");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    const error = validate();
    if (error) { msg.textContent = error; return; }

    const payload = {
      nama: nameEl.value.trim(),
      whatsapp: normalizeWA(waEl.value),
      instansi: instEl.value.trim(),
      ebook: EBOOKS[selected].title,
      waktu: new Date().toISOString(),
    };

    btn.disabled = true;
    btn.textContent = "Memproses...";

    try {
      if (FORM_ENDPOINT) {
        // mode no-cors: respons tidak bisa dibaca, hanya error jaringan yang tertangkap
        await fetch(FORM_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        });
      } else {
        console.warn("[Ebook] FORM_ENDPOINT belum diisi. Data tidak tersimpan.", payload);
      }
      unlock();
    } catch (err) {
      console.error("[Ebook] gagal kirim:", err);
      msg.textContent = "Koneksi bermasalah. Coba lagi sebentar.";
      btn.disabled = false;
      btn.textContent = "Buka ebook";
    }
  });
</script>
</body>
</html>
